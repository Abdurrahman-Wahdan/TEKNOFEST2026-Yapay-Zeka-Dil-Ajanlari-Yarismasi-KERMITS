# Alembic. The URL is deliberately absent -- env.py reads it from
# config/settings.py, so the database is configured in exactly one place and a
# migration can never run against a different database than the app.
#
#   alembic revision --autogenerate -m "what changed"
#   alembic upgrade head

[alembic]
script_location = api/migrations
prepend_sys_path = .
# Version files sort by date, so `ls versions/` reads as a history.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
