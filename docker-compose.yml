# The two stateful services. The API and the frontend run on the host, not
# here -- both want a fast reload loop, and neither has state to keep.
#
#   docker compose up -d
#
# Qdrant is bound to the same $HOME/qdrant_storage the README's `docker run`
# used, so an index built before this file existed is still there. Changing that
# path means re-embedding the whole corpus.

services:
  postgres:
    image: postgres:17-alpine
    container_name: tf26-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tf26
      POSTGRES_PASSWORD: tf26
      POSTGRES_DB: tf26
      # Turkish collation. Without it 'ı' and 'i' sort in ASCII order, which is
      # wrong for every bank and product name in the database.
      POSTGRES_INITDB_ARGS: "--locale=tr_TR.UTF-8 --encoding=UTF8"
    ports:
      # 5433, not 5432: this machine already runs another project's Postgres on
      # the default port. Loopback only, too -- 5432:5432 binds every interface,
      # which on a laptop on a café network is an open database with a
      # guessable password.
      - "127.0.0.1:5433:5432"
    volumes:
      - tf26-postgres:/var/lib/postgresql/data
    healthcheck:
      # `alembic upgrade head` immediately after `up -d` otherwise races the
      # first-boot initdb, which restarts the server mid-connection.
      test: ["CMD-SHELL", "pg_isready -U tf26 -d tf26"]
      interval: 5s
      timeout: 5s
      retries: 10

  # If you already have the README's hand-started `qdrant` container running,
  # remove it before `up` -- both bind 6333 and both mount the same storage
  # directory, and two Qdrants writing one directory is corruption, not a port
  # clash it can report:
  #
  #   docker rm -f qdrant
  qdrant:
    # Pin server and Python client to the same minor release. An unpinned image
    # restored a 1.15 snapshot while requirements installed client 1.19, which
    # Qdrant correctly warns is outside its supported compatibility window.
    image: qdrant/qdrant:v1.15.1
    container_name: tf26-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - ${HOME}/qdrant_storage:/qdrant/storage

  # Metasearch for on-demand bank research. It is loopback-only and its JSON API
  # is consumed by bank specialists; the supervisor has no direct search tool.
  searxng:
    image: docker.io/searxng/searxng@sha256:11a9b34cdc0b1ec2b991470a2762ecb5a1a531898289fb51dcd015260450729e
    container_name: tf26-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro

volumes:
  tf26-postgres:
