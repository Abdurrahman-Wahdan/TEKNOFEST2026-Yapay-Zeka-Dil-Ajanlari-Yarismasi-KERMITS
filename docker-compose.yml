services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: tf26-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API + web dashboard (http://localhost:6333/dashboard)
      - "6334:6334"   # gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage   # kalıcı depolama (repo altında)
    # kaynak sınırı (opsiyonel):
    # deploy:
    #   resources:
    #     limits:
    #       memory: 4g
